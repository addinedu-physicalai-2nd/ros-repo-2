# 자동 생성: tools/gen_world.py (fleet_agent.yaml -> use_sim_time: false)
# fleet_agent 설정 (로봇 3대 공통. robot_id · start_node는 launch 인자로)
fleet_agent:
  ros__parameters:
    use_sim_time: false
    map_frame: map
    base_frame: base_link
    nav_action: navigate_to_pose
    state_hz: 5.0
    battery_topic: ""            # sensor_msgs/BatteryState 토픽. 비우면 battery_default를 보냄
    battery_default: 100.0
    pass_tolerance: 0.08         # 중간 노드를 지났다고 볼 거리 (m). 이 안에 들어오면 다음 노드로
    yaw_tolerance: 0.15          # rad
    reverse_speed: 0.08          # 후진 속도 (m/s). 후진은 주방 통로(N15 -> P2)뿐 (serve_run 실측 8 cm/s)
    localize_fwd_m: 0.15         # 위치 맞추기(Control LOCALIZE): 도크에서 앞으로 나오는 거리 (노드별은 precision_stops <노드>.localize.fwd)
    localize_speed: 0.05         # 그때 직진 속도 (m/s)
    localize_spin_deg: 360.0     # 제자리 회전 각도
    localize_w: 0.6              # 회전 속도 (rad/s)
    corridor_handover: false   # 시뮬 (gen_world.py)
    reverse_tolerance: 0.03      # 후진 도착 거리 (m)
    done_grace_sec: 0.5          # 줄이 비고 이만큼 기다렸다가 끝 처리 (연달아 오는 APPEND 기다림)
    nav_retries: 1               # Nav2 실패 때 다시 보내는 횟수 (그래도 안 되면 CMD_FAILED)
    nav_ok_tolerance: 0.10       # Nav2가 성공이라는데 노드에서 이보다 멀면 다시 보냄 (최대 3번. 목표 바꿀 때 옛 목표 성공이 섞이는 것 막기)
    guide_check_turn_deg: 999.0  # 안내 중 이보다 크게 꺾이는 노드에서 멈춰 뒤돌아 손님 확인 (999 = 안 함. 손님은 N1에서 한 번만 맞음)
    guide_check_gap_m: 0.8       # 바로 전 인사 · 확인 자리에서 이 안이면 확인 안 함 (맵이 작아서 너무 자주 서지 않게)
    guide_check_every_node: false # true = 꺾임과 상관없이 지나가는 노드마다 뒤돌아 손님 확인 (도착지는 빼고)
    block_wait_sec: 10.0         # 장애물(사람 · 물건 모두): 이만큼 기다렸다가 서버에 BLOCKED -> 서버가 막힌 노드를 피해 다른 길
                                 # 그 전에 비키면 그대로 감. 0 = 예전 방식 (아래 종류별 시간)
    person_backoff_m: 0.12       # 카메라 사람으로 막혔던 자리에서 크게 돌아 나갈 때 먼저 곧게 후진 (돌다 몸으로 치는 것). 0 = 안 함
    person_backoff_speed: 0.05
    person_backoff_sec: 30.0     # 막힌 뒤 이 안에 새 길로 나갈 때만
    person_backoff_turn_deg: 90.0  # 가야 할 방향이 지금 앞에서 이만큼 넘게 틀어질 때만 (똑바로 가면 그냥)
    block_person_wait_sec: 10.0  # 카메라 YOLO로 사람이 확인되면: 우회 안 하고 이만큼까지 '지나갈게요'로 기다림, 그래도 있으면 BLOCKED (서버가 맵에 표시 · 우회)
    dynamic_wait_sec: 3.0        # 이만큼 뒤부터 LCD '지나갈게요' (block_wait_sec이 0이면: 사람 기다림)
    dynamic_ask_sec: 5.0         # 사람: 그다음 LCD '지나갈게요' -> 이만큼 뒤 서버에 BLOCKED
    static_wait_sec: 2.0         # 물건: 이만큼 확인하고 BLOCKED
    unknown_wait_sec: 8.0
    pass_text: "지나갈게요"

docking:
  ros__parameters:
    use_sim_time: false
    timeout_sec: 40.0            # 이 안에 못 끝내면 멈추고 Nav2 위치 인정 (마커 도킹 v4.2는 보통 10~25초)
                                 # 통로 넘겨받기처럼 긴 동작은 precision_stops.yaml의 timeout이 우선
    ir_topic: /ir_sensor/range   # 바닥 센서 3개 (pinky_sensor_adc main_node). tape · tape_exit에서 씀

obstacle:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan
    scan_yaw_offset: 3.14159265   # 시뮬 (gen_world.py)
    sector_deg: 30.0
    stop_distance_forward: 0.18  # 로봇 중심 기준 (m). 앞 몸체 0.06 + 여유
    stop_distance_reverse: 0.28  # 뒤 바구니 0.15 + 여유
    range_min_valid: 0.03
    dynamic_window_sec: 1.5
    dynamic_move_m: 0.04
    static_sec: 2.0
    person_hold_sec: 2.0         # guide 노드가 '사람 보임'을 보낸 뒤 이만큼 PERSON으로 믿음
    camera_block: true           # guide 노드 카메라가 '바로 앞 손님'을 보면 LiDAR에 안 잡혀도 막힘 (작은 레고 사람)
    camera_hold_sec: 1.0         # 그 결과가 이만큼 안 오면 저절로 풀림

camera:
  ros__parameters:                    # camera_node: 카메라를 혼자 열고 발행 (docking · guide · detect_view가 구독)
    use_sim_time: false
    width: 640                        # marker_dock 보정(FX) 기준 크기. 바꾸면 marker_dock --calibrate 다시
    height: 480
    fps: 15.0
    rotate_180: true                  # 카메라가 거꾸로 달림 -> 똑바로 돌려서 발행 (구독하는 쪽은 안 돌림)
    publish_compressed: true          # /camera/image_raw/compressed (PC guide_view용. 구독자가 있을 때만 압축)

guide:
  ros__parameters:
    use_sim_time: false
    camera_topic: /camera/image_raw   # sensor_msgs/Image (bgr8 / rgb8). camera_node가 발행
    camera_compressed: false          # true = sensor_msgs/CompressedImage
    class_name: toy_person            # YOLO 클래스 이름 (손님). models/best.pt: toy_person / table / pinky
    conf: 0.5
    infer_hz: 4.0                     # 확인 중에만 이만큼 YOLO (라즈베리파이 CPU)
    confirm: 2                        # 연속으로 이만큼 보이면 찾음
    wait_sec: 30.0                    # 이 안에 못 찾으면 손님 놓침 -> 서버에 guest_lost -> 안내 실패 · 로봇 집(D1)으로
    welcome_on_request: false         # true = 테이블을 고르면(greet 요청) 바로 환영 효과, 그다음 손님 기다림
                                      # false = 손님을 찾았을 때 환영
    effects: true                     # LCD 얼굴 · LED · 부저
    require_detector: false           # true = 모델 없으면 실패, false = 모델 없으면 바로 OK (시험용)
    obstacle_check: true              # 앞으로 가다 LiDAR로 막히면 YOLO로 사람인지 확인 -> /obstacle/person (막혔을 때만)
    obstacle_hz: 1.0                  # 그때 YOLO 횟수 (초당)
    cam_block: true                   # 앞으로 가는 동안 YOLO로 바로 앞 손님을 보면 멈춤 -> /obstacle/camera
                                      # (레고 사람은 LiDAR 높이보다 낮아 안 잡힘 -> 밀고 가던 문제)
    cam_block_hz: 6.0                 # 앞으로 갈 때 YOLO 횟수 (초당). LiDAR보다 먼저: 카메라가 보면 LiDAR가 비어 있어도 멈춤
    cam_block_conf: 0.70              # 멈출 때 conf (위 conf 0.5는 손님 찾기용). 헛것에 멈추면 올리기, 사람을 놓치면 내리기
    cam_block_on_n: 1                 # 최근 cam_block_on_window장 중 이만큼 보이면 멈춤 (1 = 한 장만 보여도 멈춤. 헛멈춤 많으면 2)
    cam_block_on_window: 3            # 연속이 아니어도 됨: 2/3장 (YOLO가 한 장 놓쳐도 다시 0부터 세지 않게)
    cam_block_max_area: 0.45          # 화면의 이만큼 넘게 덮는 박스는 오검출로 봄 (벽 · 테이블 전체를 손님으로 잡는 것)
    cam_block_h: 0.20                 # 손님 박스 높이가 화면 높이의 이만큼 이상이면 '가까움' (멀리서 서면 키우고, 너무 붙어서 서면 줄이기)
    cam_block_bottom: 0.85            # 또는 박스 아래끝이 화면 높이의 이만큼 아래면 '바로 앞 바닥' (작은 레고 사람)
    cam_clear_n: 16                   # 연속 이만큼 안 보여야 멈춤을 풂 (6 Hz면 약 2.7초. YOLO가 자주 놓쳐서 넉넉히)
    cam_release_x: 0.45               # 멈춘 뒤에는 화면 가운데 ±이만큼 안에 손님이 보이면 안 풂 (옆으로 비켜 가다 치는 것)
    cam_release_bottom: 0.50          # 그리고 박스 아래끝이 화면 이만큼 아래 (가까이)
    cam_turn_release_deg: 60.0        # 멈춘 뒤 로봇이 이만큼 넘게 돌면 (우회하려 뒤돌기) 카메라 멈춤을 바로 풂
    cam_spin_w: 0.3                   # 제자리 회전이 이보다 빠르면 (rad/s) 돌며 스친 화면으로는 새로 안 멈춤
    cam_lost_hold_sec: 15.0           # 너무 가까워 안 보이게 된 손님은 이만큼 더 있다고 봄 (block_person_wait_sec보다 길게: 그 전에 풀려 밀고 가지 않게)
    cam_block_x: 0.30                 # 박스 가운데가 화면 가운데에서 화면 폭의 이만큼 안 = 가는 길 위 (옆 사람은 안 멈춤)
