# 노드 그래프 v7.1 (입구 통로 + 홀 테이블 6 + 주방 통로, 도킹 3, 서버가 관리)
# v7.1: 최종 맵에 맞춰 도킹 이름 정리. 왼쪽 D2 없앰, 오른쪽 위 칸(N16 옆) D3 -> D2, 아래 칸(N15 옆) D4 -> D3
# 그림: node_map.png
#
# ID 규칙: 대문자 1글자 + 번호. 접두어 = 로봇이 거기서 하는 일
#   T 테이블 서빙 / D 도킹(주차) / P 픽업 / N 지나가는 길 위의 점  (R 퇴식은 v7 맵에 없음)
#
# 번호 매기는 순서 (v7에서 한 번 정리. 이후로는 다시 매기지 않는다)
#   N  : 홀 격자는 위 -> 아래 줄, 줄 안에서 왼 -> 오 (N1~N13). 주방 통로는 지나가는 순서 (N14 -> N15 -> N16)
#   P  : P1 = 픽업 자리, P2 = 그 앞 대기 (지나가는 순서는 P2 -> P1)
#   T, D : 위 -> 아래, 왼 -> 오 (D1 = 입구 통로, D2 · D3 = 주방 아래 구역 위(N16 옆) · 아래(N15 옆))
#   새 노드는 그 접두어의 다음 번호(N17, D5 ...)로 붙인다. 코드는 ID 글자로 판단하지 않고 필드로 판단한다.
#
# 좌표: map 프레임(m), 맵 fleet_msgs/docs/maps/pinkytorang_map_v5 기준.
#       로봇을 그 자리에 두고 AMCL 위치를 찍은 값 (2026-10-30, node_mark.py). yaw는 yaw 칸이 있는 STOP 노드만
#       T1~T6 = 바라보기용 점: 테이블 모서리 (통로 쪽 짧은 변, 두 다리 가운데. 맵 v5 테이블 모양에서 계산).
#         테이블이 도착지면 직전 N에 서서 이 점을 봄 (서버가 N의 yaw를 다음 노드 T 쪽으로 계산 -> 자동).
#         길 연결(N2 -> T1 -> N3)은 그대로 두어 서버 lock이 서빙 중인 로봇의 차선을 막는다. T를 지나가기만 할 때는
#         fleet_agent가 앞 N -> 다음 N 직선 위로 내린 점으로 감 (core._nav_xy, 테이블로 파고들지 않게)
#       N2~N13은 찍은 값에서 맵 계산으로 최대 4 cm 옮김 (바구니까지 21 cm 로봇이 꺾거나 테이블을 볼 때
#       벽 · 테이블과 여유가 가장 크게. 찍은 값은 테이블 쪽으로 붙어 있었음. 옮기기 전 여유 -0.5~5 cm -> 1.8~10 cm)
#       맵을 다시 만들면 좌표도 다시 찍어야 한다.
#
# 필드
#   type      : PASS(지나가는 점) / STOP(로봇이 서서 일하는 곳)
#   stop_kind : STOP일 때만. QUEUE(대기) / PICKUP / SERVE / DOCK
#   table     : SERVE일 때만. 서빙하는 테이블
#   lock      : v7은 전부 true
#   pocket    : true면 차선 옆으로 빠진 정차 자리 (도킹)
#   entry     : pocket 진입 방향. FORWARD(기본, 전진 진입·후진 출차) / REVERSE(후진 진입·전진 출차)
#               도킹 D1~D3은 전부 REVERSE: 바구니(뒤)를 벽 쪽에 두고 앞이 통로를 본다
#   yaw       : STOP 노드에서 로봇 "앞"이 보는 방향(rad). PASS 노드의 yaw는 서버가 진행 방향으로 계산한다.
#               위(+y) 1.5708 / 오른쪽(+x) 0 / 아래(-y) -1.5708 / 왼쪽(-x) 3.1416
#   next      : 갈 수 있는 다음 노드. 양방향 엣지는 양쪽 노드에 서로 적고, 일방통행은 한쪽에만 적는다.
#
# 바구니: 로봇 뒤쪽. 바구니를 대야 하는 곳(P1 픽업대, 테이블)은 뒤가 그쪽을 보게 yaw를 둔다.
# 정밀 정차 방법(dock / align / tape)은 서버가 아니라 로봇 쪽 설정이다: precision_stops.yaml

nodes:
  # ---- 홀 1줄: 윗길 (양방향) ----
  - {id: N1, type: PASS, lock: true, x: 1.836, y: -0.820, next: [N2, D1]}   # 왼쪽 위, 입구 통로 위쪽 끝
  - {id: N2, type: PASS, lock: true, x: 1.496, y: -0.781, next: [N1, T1, N5]}
  - {id: N3, type: PASS, lock: true, x: 0.999, y: -0.775, next: [T1, T2, N6]}
  - {id: N4, type: PASS, lock: true, x: 0.620, y: -0.720, next: [T2, N7]}   # P1에서 나오는 길의 합류점 (N4 -> P1 없음)

  # ---- 홀 2줄 (양방향) ----
  - {id: N5, type: PASS, lock: true, x: 1.443, y: -0.332, next: [N2, T3, N8]}
  - {id: N6, type: PASS, lock: true, x: 1.021, y: -0.318, next: [N3, T3, T4, N9]}
  - {id: N7, type: PASS, lock: true, x: 0.603, y: -0.324, next: [N4, T4, N10]}

  # ---- 홀 3줄 (양방향) ----
  - {id: N8, type: PASS, lock: true, x: 1.484, y: 0.071, next: [N5, T5, N11]}
  - {id: N9, type: PASS, lock: true, x: 1.032, y: 0.092, next: [N6, T5, T6, N12]}
  - {id: N10, type: PASS, lock: true, x: 0.612, y: 0.109, next: [N7, T6, N13]}

  # ---- 홀 4줄: 맨 아랫길 (양방향, N13 -> N14만 일방) ----
  - {id: N11, type: PASS, lock: true, x: 1.458, y: 0.439, next: [N8, N12]}
  - {id: N12, type: PASS, lock: true, x: 0.992, y: 0.470, next: [N11, N9, N13]}
  - {id: N13, type: PASS, lock: true, x: 0.589, y: 0.522, next: [N12, N10, N14]}   # N13 -> N14 일방통행 (N14 -> N13 없음)

  # ---- 주방 통로 (N14 -> P1 후진 일방통행, 지나가는 순서대로 번호) ----
  - {id: N14, type: PASS, lock: true, x: 0.189, y: 0.522, next: [N15]}   # 통로 입구. 마커 2개로 위치·축 정렬 후 후진 시작 (align)
  - {id: N15, type: PASS, lock: true, x: 0.197, y: 0.157, next: [N16, D3]}   # D3 출입 축. 바닥 가로선
  - {id: N16, type: PASS, lock: true, x: 0.150, y: 0.034, next: [P2, D2]}   # D2 출입 축. 바닥 가로선
  - {id: P2, type: STOP, stop_kind: QUEUE, lock: true, x: 0.268, y: -0.384, yaw: 1.625, next: [P1]}   # 픽업 대기 (후진 중이라 앞은 아래)
  - {id: P1, type: STOP, stop_kind: PICKUP, lock: true, x: 0.251, y: -0.905, yaw: 0.071, next: [N4]}   # 픽업. 테이프로 뒤(바구니)를 주방 픽업대에 넣음 (tape). P1 -> N4 일방통행

  # ---- 테이블 = 바라보기용 점 (테이블 모서리). 지나갈 때는 로봇이 N-N 직선 위로 감 (core._nav_xy) ----
  - {id: T1, type: STOP, stop_kind: SERVE, table: T1, lock: true, x: 1.217, y: -0.929, next: [N2, N3]}
  - {id: T2, type: STOP, stop_kind: SERVE, table: T2, lock: true, x: 0.754, y: -0.904, next: [N3, N4]}
  - {id: T3, type: STOP, stop_kind: SERVE, table: T3, lock: true, x: 1.242, y: -0.455, next: [N5, N6]}
  - {id: T4, type: STOP, stop_kind: SERVE, table: T4, lock: true, x: 0.792, y: -0.430, next: [N6, N7]}
  - {id: T5, type: STOP, stop_kind: SERVE, table: T5, lock: true, x: 1.267, y: -0.005, next: [N8, N9]}
  - {id: T6, type: STOP, stop_kind: SERVE, table: T6, lock: true, x: 0.792, y: -0.005, next: [N9, N10]}

  # ---- 도킹 (후진 진입·전진 출차, 앞은 통로 쪽 = 왼쪽, 바구니는 벽 쪽) ----
  - {id: D1, type: STOP, stop_kind: DOCK, pocket: true, entry: REVERSE, lock: true, x: 1.824, y: 0.386, yaw: -0.077, next: [N1]}   # 입구 통로 (마커 1 · 6). 로봇은 N1에서 entrance로 통째로 (precision_stops)
  - {id: D2, type: STOP, stop_kind: DOCK, pocket: true, entry: REVERSE, lock: true, x: 0.029, y: -0.021, yaw: -0.022, next: [N16]}   # 주방 아래 구역 위 칸 (N16 옆, 마커 2)
  - {id: D3, type: STOP, stop_kind: DOCK, pocket: true, entry: REVERSE, lock: true, x: 0.005, y: 0.125, yaw: -0.012, next: [N15]}   # 주방 아래 구역 아래 칸 (N15 옆, 마커 3)

# 후진 구간. [A, B, C] = A->B, B->C 엣지를 후진으로만 간다. 첫 노드와 끝 노드는 lock 노드 (회전하는 곳).
reverse:
  - [N14, N15, N16, P2, P1]

# 양방향 1차선 구간의 lock 정책 (한 번에 잡기 / 길 잠금)은 서버 쪽에서 정한다. v7은 홀 격자 전체가 양방향이라
# 구간 목록을 아직 정하지 않았다. README 7장 미정 참고.
two_way_zones: []
