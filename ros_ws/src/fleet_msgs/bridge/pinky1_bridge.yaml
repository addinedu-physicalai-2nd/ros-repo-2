# 자동 생성: python3 make_bridge_config.py pinky1 51 --server-domain 50
# 서버 도메인(50) <-> pinky1 도메인(51) 사이에서 fleet 토픽 5개만 전달한다.
# 로봇 쪽은 namespace 없이 /fleet/..., 서버 쪽은 /pinky1/fleet/... 로 이름을 바꿔 전달한다.
# Nav2, tf, 라이다 등 나머지 토픽은 pinky1 도메인 안에만 남는다.
#
# 실행: ros2 run domain_bridge domain_bridge pinky1_bridge.yaml
# (실행하는 터미널에서 fleet_msgs가 source 되어 있어야 한다)

name: pinky1_fleet_bridge
from_domain: 51     # 기본 방향: 로봇 -> 서버
to_domain: 50

topics:
  # ---- 로봇 -> 서버 ----
  /fleet/state:
    type: fleet_msgs/msg/RobotState
    remap: /pinky1/fleet/state
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 1

  /fleet/event:
    type: fleet_msgs/msg/RobotEvent
    remap: /pinky1/fleet/event
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  # ---- 서버 -> 로봇 (토픽별로 도메인 방향을 뒤집음) ----
  /pinky1/fleet/move:
    type: fleet_msgs/msg/Move
    from_domain: 50
    to_domain: 51
    remap: /fleet/move
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /pinky1/fleet/control:
    type: fleet_msgs/msg/Control
    from_domain: 50
    to_domain: 51
    remap: /fleet/control
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /pinky1/fleet/display:
    type: fleet_msgs/msg/Display
    from_domain: 50
    to_domain: 51
    remap: /fleet/display
    qos:
      reliability: reliable
      durability: transient_local   # 로봇(또는 브리지)이 늦게 켜져도 마지막 화면을 받음
      history: keep_last
      depth: 1
