# 핑키토랑 Main Service 시험 설정 (도킹 없이 아무 노드에서 켜서 시험)
# main_service.yaml과 같고 [시험] 표시한 값만 다르다
# 상대 경로는 이 파일이 있는 폴더 기준

http_port: 8080
web_root: ../../../web             # pinkytorang/web (고객 · 매장 · 입구 키오스크 UI). ros-repo-2에 올리면 ../../../web
db_path: ../pinkytorang_test.db  # [시험] 운영 DB와 따로
node_graph: ../../fleet_msgs/docs/node_graph.yaml     # fleet_msgs v7.1 docs/node_graph.yaml 복사본 (그림 node_map_v7.png). ros-repo-2에 올리면 ../../fleet_msgs/docs/node_graph.yaml 로 바꾸고 복사본은 지움

# 키오스크 배치도에 그릴 범위 (map 좌표, m) = 실측 노드(pinkytorang_waypoints.yaml) 기준으로 옛 범위를 옮긴 값 [추정]
board_x: -0.235
board_y: -1.399
board_w: 2.50
board_h: 2.19
board_flip: true                # 새 맵은 매장 그림과 180도 거꾸로라 배치도를 돌려 그림 (입구가 왼쪽 위)

# 서버 쪽 토픽 앞에 붙는 로봇 ID (/pinky1/fleet/...)
robots: [pinky1, pinky2, pinky3]

# ---- 작업 규칙
table_timeout_sec: 30           # 서빙: 손님 수령 카운트다운
guide_timeout_sec: 15           # 안내: 착석 확인 카운트다운
pickup_timeout_sec: 5           # 픽업: 0 = 주방 '적재 완료' 버튼으로만. 실제 로봇 시험 중이라 5초 뒤 자동 출발
auto_ready: true                # true = 주문하면 바로 조리 완료 (주방 버튼 없이). 실제 로봇 시험용, 운영 땐 false
depart_grace_sec: 2             # 카운트다운 0 이후 실제 출발까지
max_active_serve: 2             # 빈 테이블이 있을 때 동시 서빙 최대 (만석이면 로봇 전부)
max_active_guide: 1             # 동시 안내 최대
serve_batch_max: 3              # 같은 테이블 주문을 한 번에 싣는 최대 건수
reassign_after_sec: 10          # 적재 전 로봇이 이만큼 고장 · 통신 끊김이면 다른 로봇에 다시 배정

# ---- 도킹 구역 · 대기 배치
entrance_docks: [D1, D2]        # 입구 쪽 (앞칸부터). 안내는 여기 서 있는 로봇이 한다 (앞칸 로봇부터)
pickup_docks: [D3, D4]          # 픽업 쪽
dock_via: {D2: D1}              # 뒤칸: 앞칸. D2(안쪽)는 D1이 비어 있어야 드나든다. 둘 다 비면 D2부터 채운다
busy_tables: 4                  # 찬 테이블(사용 중 + 안내 중)이 이 수 이상이면 바쁨
entrance_standby_quiet: 0       # [시험] 입구 대기 배치 안 함
entrance_standby_busy: 0        # [시험]
entrance_keep_penalty_m: 1.5    # 서빙 배정 때 입구 로봇에 더하는 비용 (만석이 아니면, 다른 로봇이 비슷한 거리면 그쪽에 서빙)

# ---- 테이블 (id = node_graph의 table 값). 손님이 입구 키오스크 배치도에서 빈 테이블을 직접 고른다
#      x, y = 배치도에 그릴 테이블 중심 (map 좌표, m), w, h = 크기 (m)
#      [추정] 정차점 T + 옛 맵의 테이블 간격을 새 맵 방향으로 옮긴 값. 새 맵은 옛 맵과 약 180도 돌아가 있어 테이블이 정차점 -y 쪽
tables:
  - {id: T1, x: 1.258, y: -1.064, w: 0.150, h: 0.150}   # 위쪽 벽 테이블 왼쪽
  - {id: T2, x: 0.816, y: -1.094, w: 0.150, h: 0.150}   # 위쪽 벽 테이블 오른쪽
  - {id: T3, x: 1.269, y: -0.738, w: 0.150, h: 0.200}   # 가운데 줄 왼쪽
  - {id: T4, x: 0.806, y: -0.746, w: 0.150, h: 0.200}   # 가운데 줄 오른쪽
  - {id: T5, x: 1.192, y: -0.265, w: 0.150, h: 0.200}   # 아래 줄 왼쪽
  - {id: T6, x: 0.742, y: -0.296, w: 0.150, h: 0.200}   # 아래 줄 오른쪽

# ---- 배터리 (%) : 로봇 fleet/state 의 battery 값. 0 으로 두면 검사 안 함
min_battery_pct: 30             # 작업이 끝날 때마다 확인: 이보다 낮으면 새 작업 · 이어받기 안 하고 도킹에서 충전 (도킹에서 충전된다고 가정)
ready_battery_pct: 80           # 충전 중인 로봇은 이 이상이 돼야 다시 배정

# ---- 시작 규칙
require_dock_start: false       # true = 로봇은 도킹 위에서 켠다. 처음 위치가 도킹이 아니면 배정 안 함 (알림)
stay_at_start: true             # [시험] 켤 때 노드가 집: 쉬면 거기서 대기, 작업 끝나면 거기로 돌아감 (도킹으로 안 감)

# ---- 교통
comm_timeout_sec: 3.0           # fleet/state가 이만큼 안 오면 통신 끊김
lock_lookahead: 2               # 로봇 앞쪽으로 미리 잡는 lock 노드 수
detour_max_m: 1.0               # 앞 로봇이 움직이는 중이면 우회가 이만큼(m) 이하로 길어질 때만 돌아감, 아니면 기다림
detour_wait_sec: 8              # 이만큼 기다려도 안 풀리면 길이 상관없이 우회
avoid_sec: 6                    # 우회를 정하면 막힌 노드를 이 시간 동안 경로 계산에서 뺌
localize_radius_m: 0.15         # last_node가 비어 있을 때 좌표로 노드 찾는 반경

# ---- UI
done_keep_sec: 600              # 끝난 작업을 매장 화면 완료 열에 남기는 시간

# ---- LCD 문구 ({table} = 테이블 이름). LCD 한글이 안 되면 영어로 바꾼다
display:
  to_pickup: ""
  at_pickup: "음식을 올려 주세요"
  to_table_serve: "{table} 배달 중"
  at_table_serve: "음식이 도착했습니다. 가져가 주세요"
  to_table_guide: "{table}(으)로 안내할게요. 따라오세요"
  at_table_guide: "{table}입니다. 자리에 앉아 주세요"
  to_dock: ""
  idle: ""

# ---- 메뉴 (GET /api/menu)
menu:
  - {id: 1, name: "토마토 파스타", price: 12000, desc: "생토마토 소스, 바질"}
  - {id: 2, name: "크림 리조또", price: 13000, desc: "버섯, 파르메산"}
  - {id: 3, name: "마르게리타 피자", price: 15000, desc: "모차렐라, 바질"}
  - {id: 4, name: "시저 샐러드", price: 9000, desc: "로메인, 베이컨, 크루통"}
  - {id: 5, name: "레몬에이드", price: 5000, desc: "직접 짠 레몬"}
  - {id: 6, name: "아이스 아메리카노", price: 4000, desc: ""}
