# 로봇 쪽 정밀 정차 설정 (v9: 노드 이름 = 최종 맵 D1 · D2 · D3). fleet 에이전트가 읽는다. 서버는 이 파일을 모른다.
# Waypoint.node_id로 찾아서, 그 노드에 도착한 뒤 아래 방법으로 정확히 선다.
#
# method
#   dock    : 마커로 정렬한 뒤 back 만큼 후진해서 주차. 끝나면 CMD_DONE (marker_dock.py v4.3)
#   align   : 마커로 위치·방향만 맞추고 다음 Move를 이어 간다. 방향을 바꾸는 노드에서 쓴다
#             front/axis가 있으면 N14 방식 (docking/corridor.py): 마커 4(front) 찾기 · 정렬 -> 기록 거리 -> turn_deg
#             -> 마커 5(axis)와 벽면 수직.  hold_axis: true -> 이 방향이 이어지는 후진의 축 (출발 회전 생략)
#   entrance: 입구 D1. from 노드(N1)에서 도착지 D1 쪽을 보고 docking에 통째로 (통로 가운데로 -> 마커 6 · 1 교점 -> 우90
#             -> 곧게 후진). 끝나면 돌지 않고 CMD_DONE. leave entrance_exit: 교점까지 나와 북쪽 -> Nav2
#   tape    : 바닥 테이프(E자)로 바구니를 픽업대에 넣음. 끝나면 CMD_DONE (도착지일 때)
#             ir_black: 바닥 센서 검정 문턱 (통로 바닥이 ~3500으로 한 번씩 튀어서 3800)
#   dock_in : 통로 쪽 도크 (후진으로 칸에 넣음): 도크 줄 노드(N15 / N16) 가로선에서 서고 -> 우90
#             -> 도크 마커로 stop 자세 -> target 자세까지 후면 주차 (docking/corridor.py Steps.park_from_line)
#             stop · target = ~/dock_target_<이름>.json
#   timeout : (선택) docking이 이 초 안에 못 끝내면 멈추고 Nav2 위치 인정. 없으면 docking timeout_sec (40)
#
# 통로 (N14 -> N15 -> N16 -> P2 -> P1, fleet_agent corridor_handover: true, 기본)
#   N15 · N16 바닥에 짧은 가로선(검정 테이프). 각 도크(D3 · D2)에서 곧게 나와 좌90 한 자세에서 바닥 센서 밑
#   축이 정해진 뒤(N14 align hold_axis, undock hold_axis)의 후진은 docking에 맡긴다 (method: corridor):
#   라이다 양옆 벽과 평행 · 서쪽 벽에서 가운데로 후진하며 가로선을 밟을 때마다 그 노드 NODE_REACHED (안 섬)
#   -> 서버가 다음 노드를 APPEND -> 달리는 중에 이어 붙임. 도착지가 tape(P1) / dock_in(D2 · D3)이면 then으로 같이
#   노드 사이 거리 · 문턱은 docking/corridor.py BAR_GAP · BAR_BLACK
#   corridor: false 를 노드 설정에 넣으면 그 노드는 예전 방식 (tape_approach / cmd_vel 후진)
#
# leave (선택): 그 노드에서 CMD_DONE 한 뒤 다음 출발 전에 하는 정밀 동작 (켤 때 서 있던 노드도 해당)
#   undock    : 마커로 나올 자리(to)까지 + turn_deg 회전 (+ align 있으면 방위각 정렬). to 노드 도착으로 치고 Nav2 안 씀
#               target = ~/dock_target_<target>.json. 통로 도크는 align 없이: 방향은 통로 docking이 라이다 벽으로
#               (마커 5는 N14에 다른 로봇이 있으면 가려짐)
#               hold_axis: true -> 이어지는 후진을 이 방향 그대로 (그다음 통로 넘겨받기)
#   tape_exit : 앞으로 가며 테이프 선을 세서 exit_legs번째(기본 2 = 새 선)에서 정지 -> 그다음 Nav2
#   quiet_to_next: true -> leave 뒤 다음 노드에 닿을 때까지 LiDAR 장애물 정지를 끔 (P1 -> N4 좁은 틈)
#
# 기록 (fleet_agent 끄고 bringup + 바닥 센서만, 형식: fleet_msgs/docs/record_json_format.md)
#   ros2 run fleet_agent dock_record all              D3 칸에 손으로: d3 · n15 · n15s · n14s · n14e
#   ros2 run fleet_agent dock_record dock --dock d2   D2 칸에 손으로: d2 · n16 · n16s
#   ros2 run fleet_agent dock_record d1               D1 칸에 손으로: d1 · 교점(마커 1 · 6) · N1 (끝: N1에서 남쪽)
#   기록이 끝난 자세(좌90, 남쪽을 봄)에서 바닥 센서 밑에 그 노드의 가로선을 붙인다
#
# 마커 ID (최종 맵): 1 D1 · 2 D2 칸 앞 칸막이 (N16 옆) · 3 D3 칸 앞 칸막이 (N15 옆) · 4 N14 동쪽 벽 · 5 N14 남쪽 벽 (5 cm)
#   · 6 입구 박스 (D1 정렬, 5 cm) · 11~62 테이블 다리
# 도킹 알림: dock / dock_in / entrance가 끝나면 RobotEvent DOCKED, undock / entrance_exit가 끝나면 UNDOCKED (fleet_msgs v10)
# 목록에 없는 노드는 Nav2 / odom 도착만으로 끝낸다.

N14: {method: align, front: n14e, axis: n14s, turn_deg: -90, hold_axis: true}   # 마커 4 -> 우90 -> 마커 5

D1:  {method: entrance, from: N1, timeout: 120,         # 입구 통로 (안내 로봇 자리). N1에서 D1 쪽을 보고 통째로: docking/entrance.py
      leave: {method: entrance_exit, timeout: 60}}       # 빠지기: 교점까지 나와 북쪽 -> 그다음 Nav2로 N1. 기록: dock_record d1
D2:  {method: dock_in, marker: 2, stop: n16, target: d2, timeout: 70,    # N16 옆. 기록: dock_record dock --dock d2
      leave: {method: undock, marker: 2, target: n16, to: N16, turn_deg: 90, hold_axis: true}}
D3:  {method: dock_in, marker: 3, stop: n15, target: d3, timeout: 70,    # N15 옆. 기록: dock_record all
      leave: {method: undock, marker: 3, target: n15, to: N15, turn_deg: 90, hold_axis: true}}

P1:  {method: tape, x_after: 0.035, timeout: 60, ir_black: 3800,          # 바구니(뒤)를 주방 픽업대에 넣음 (E자 테이프)
      leave: {method: tape_exit, exit_legs: 2, quiet_to_next: true, ir_black: 3800}}  # 받은 뒤 새 선까지 빼고 Nav2 (N4)

# 테이블: 직전 노드(from = 들어온 노드)에서 Nav2로 서고 (서버 yaw = 들어가는 방향) -> docking table:
#   기록에서 계산한 방향으로 돌아 다리 마커 찾기 · 가운데 맞추기 · 측정 -> 차선 올라타기
#   -> 정렬 시작부터 lines번째 바닥 선에서 정지 -> CMD_DONE
#   마커 ID = 테이블 번호 + 1(왼쪽) / 2(오른쪽), 기록 = ~/dock_target_<target>.json (table_align.py --record-lane)
#   face: [x, y] = 테이블 모서리 (통로 쪽 짧은 변, 두 다리 가운데. 맵 v5). 직전 노드에서 이 점을 보고 섬
#         (fleet_agent core._nav_yaw. 없으면 서버 yaw = 다음 노드 쪽). 노드 좌표(T)는 차선 위라 따로 둠
#   leave table_exit: 서빙 뒤 지금 방향으로 dist(m) 전진 -> 그다음 Nav2 (costmap 경계 벗어나기)
#   (docking_node의 table · table_exit는 table_dock.py 구현 뒤 동작. 그 전엔 실패 -> Nav2 위치 인정)
T1: {method: table, lines: 2, timeout: 60, face: [1.217, -0.929],
     from: {N2: {marker: 11, target: t1l}, N3: {marker: 12, target: t1r}},
     leave: {method: table_exit, dist: 0.1}}
T2: {method: table, lines: 2, timeout: 60, face: [0.754, -0.904],
     from: {N3: {marker: 21, target: t2l}, N4: {marker: 22, target: t2r}},
     leave: {method: table_exit, dist: 0.1}}
T3: {method: table, lines: 2, timeout: 60, face: [1.242, -0.455],
     from: {N5: {marker: 31, target: t3l}, N6: {marker: 32, target: t3r}},
     leave: {method: table_exit, dist: 0.1}}
T4: {method: table, lines: 2, timeout: 60, face: [0.792, -0.430],
     from: {N6: {marker: 41, target: t4l}, N7: {marker: 42, target: t4r}},
     leave: {method: table_exit, dist: 0.1}}
T5: {method: table, lines: 2, timeout: 60, face: [1.267, -0.005],
     from: {N8: {marker: 51, target: t5l}, N9: {marker: 52, target: t5r}},
     leave: {method: table_exit, dist: 0.1}}
T6: {method: table, lines: 2, timeout: 60, face: [0.792, -0.005],
     from: {N9: {marker: 61, target: t6l}, N10: {marker: 62, target: t6r}},
     leave: {method: table_exit, dist: 0.1}}
