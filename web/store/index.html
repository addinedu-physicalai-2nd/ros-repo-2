<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>핑키토랑 · 매장관리</title>
  <link rel="stylesheet" href="/common/base.css">
  <link rel="stylesheet" href="/store/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-left">
      <div class="brand"><span class="brand-mark"></span>핑키토랑</div>
      <span class="bar-sub">매장관리</span>
    </div>
    <div class="bar-right">
      <span id="clock" class="clock num"></span>
      <span id="conn" class="conn">연결 중</span>
      <button id="historyBtn" class="btn btn-ghost">이력</button>
      <button id="stopAllBtn" class="btn btn-danger">전체 정지</button>
    </div>
  </header>

  <div id="alerts" class="alerts"></div>

  <div class="layout">
    <main class="main">
      <section>
        <div class="sec-head"><h2>확인 필요</h2><span id="confirmCount" class="count num"></span></div>
        <div id="confirms" class="confirms"></div>
      </section>

      <section>
        <div class="sec-head"><h2>테이블</h2></div>
        <div id="tables" class="tables"></div>
      </section>

      <section class="board">
        <div class="col">
          <div class="sec-head"><h2>조리 중</h2><span id="cntCook" class="count num"></span></div>
          <div id="colCook" class="cards"></div>
        </div>
        <div class="col">
          <div class="sec-head"><h2>대기</h2><span id="cntWait" class="count num"></span></div>
          <div id="colWait" class="cards"></div>
        </div>
        <div class="col">
          <div class="sec-head"><h2>진행</h2><span id="cntRun" class="count num"></span></div>
          <div id="colRun" class="cards"></div>
        </div>
        <div class="col">
          <div class="sec-head"><h2>완료</h2><span id="cntDone" class="count num"></span></div>
          <div id="colDone" class="cards"></div>
        </div>
      </section>
    </main>

    <aside class="side">
      <div class="sec-head"><h2>로봇</h2></div>
      <div id="robots" class="robots"></div>
    </aside>
  </div>

  <!-- 이력 -->
  <div id="historyModal" class="modal-wrap" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>이력 조회</h2>
        <button id="historyClose" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <form id="historyForm" class="filters">
        <label>시작<input type="datetime-local" id="hFrom"></label>
        <label>끝<input type="datetime-local" id="hTo"></label>
        <label>종류
          <select id="hType">
            <option value="">전체</option>
            <option value="ORDER">주문</option>
            <option value="TASK">작업</option>
            <option value="ALERT">알림</option>
          </select>
        </label>
        <button type="submit" class="btn btn-dark">검색</button>
        <a id="csvLink" class="btn btn-ghost" href="#">CSV 내려받기</a>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>시간</th><th>종류</th><th>내용</th></tr></thead>
          <tbody id="historyRows"><tr><td colspan="3" class="empty">검색해 주세요</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/common/link.js"></script>
  <script src="/store/app.js"></script>
</body>
</html>
